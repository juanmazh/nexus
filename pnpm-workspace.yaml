# Settings that pnpm 12 no longer reads from the "pnpm" field of package.json.
# Only packages that ship a legitimate postinstall (platform binaries) may build.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.63.0'
  - '@cloudflare/vitest-plugin@1.3.7'
  - miniflare@5.20261006.0-alpha
  - wrangler@4.148.0