name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# No deployment step and no secrets: the first deploy is manual
# (add-home-dashboard, roadmap 2.3).
#
# A pinned runner image, not `ubuntu-latest`: the latest label moves to a new
# Ubuntu on GitHub's schedule, and that move should be a reviewed change here,
# not a surprise in the middle of a PR. Every job has a time limit: a hung step
# (a stuck `apt` while installing Chromium kept PR #17 running for 34 minutes)
# must fail in minutes instead of burning the free Actions minutes for hours.
jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # A separate job, not another step: a responsive failure is then read in a job
  # called "responsive" instead of inside "lint, typecheck, test and build", and
  # the two run in parallel so the CI does not grow linearly (design.md D10).
  # No secrets and no deployment: the suite intercepts every /api request itself,
  # so it needs neither ACCESS_AUD nor the local bypass (design.md D8).
  e2e:
    name: Responsive (Playwright)
    runs-on: ubuntu-24.04
    # Above the two step limits below, so the report is still uploaded when one
    # of them is the one that hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Only Chromium: on the Ubuntu runner some of its system libraries are missing,
      # and Firefox or WebKit would multiply the time without finding a bug that
      # the mobile-first rules describe today.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Responsive tests
        run: pnpm test:e2e
        timeout-minutes: 10

      # A flaky test passes on a retry and leaves a trace of the attempt that
      # failed (`trace: "on-first-retry"`); without it the only evidence is one
      # line of the log. Nothing is uploaded when every test passed first time.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The step that kept being forgotten (PRs #9 and #11 were merged with the
  # change still unarchived): a PR from `change/<id>` cannot go green while
  # `openspec/changes/<id>/` exists. Archiving in the same PR keeps
  # `openspec/specs/` on main describing exactly the code on main
  # (docs/WORKFLOW.md §3, step 11). It also validates every spec.
  openspec:
    name: OpenSpec (validated and archived)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate specs
        run: npx -y @fission-ai/openspec@1.14.1 validate --all --strict

      # The branch name goes through an env var, never straight into the script:
      # an expression expanded inside `run` is a classic injection point.
      - name: The change is archived before the merge
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            change/*)
              id="${BRANCH#change/}"
              if [ -d "openspec/changes/$id" ]; then
                echo "::error::openspec/changes/$id sigue sin archivar. Ejecuta /opsx-archive $id en esta rama antes de mergear."
                exit 1
              fi
              echo "openspec/changes/$id ya está archivado."
              ;;
            *)
              echo "La rama $BRANCH no es de un cambio de OpenSpec: nada que comprobar."
              ;;
          esac
